<!DOCTYPE html>
<html lang="nl">
<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0, viewport-fit=cover"
  >

  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="theme-color" content="#f5f5f7">

  <title>LumiVault</title>
  <meta name="apple-mobile-web-app-title" content="LumiVault">
<link rel="apple-touch-icon" href="icon.png?v=2">
<link rel="stylesheet" href="style.css?v=2">
</head>

<body>

  <main class="app">

   <h1>LumiVault</h1>

    <div class="add-task">
      <input
        id="taskInput"
        type="text"
        placeholder="Nieuwe taak…"
        autocomplete="off"
      >

      <button
        id="addButton"
        type="button"
        aria-label="Taak toevoegen"
      >
        +
      </button>
    </div>

    <ul id="taskList"></ul>

  </main>

  <script>
    const input = document.getElementById("taskInput");
    const addButton = document.getElementById("addButton");
    const list = document.getElementById("taskList");

    const STORAGE_KEY = "mijnTaken";

    let tasks = loadTasks();

    function loadTasks() {
      try {
        return JSON.parse(localStorage.getItem(STORAGE_KEY)) || [];
      } catch {
        return [];
      }
    }

    function saveTasks() {
      localStorage.setItem(STORAGE_KEY, JSON.stringify(tasks));
    }

    function renderTasks() {
      list.innerHTML = "";

      if (tasks.length === 0) {
        const empty = document.createElement("div");
        empty.className = "empty";
        empty.textContent = "Geen taken 🎉";

        list.appendChild(empty);
        return;
      }

      tasks.forEach((task, index) => {
        const item = document.createElement("li");

        item.className =
          "task" + (task.done ? " completed" : "");

        const check = document.createElement("div");
        check.className = "check";

        check.addEventListener("click", () => {
          tasks[index].done = !tasks[index].done;

          saveTasks();
          renderTasks();
        });

        const text = document.createElement("span");
        text.className = "task-text";
        text.textContent = task.text;

        const remove = document.createElement("button");
        remove.className = "delete";
        remove.type = "button";
        remove.textContent = "×";
        remove.setAttribute("aria-label", "Taak verwijderen");

        remove.addEventListener("click", () => {
          tasks.splice(index, 1);

          saveTasks();
          renderTasks();
        });

        item.append(check, text, remove);
        list.appendChild(item);
      });
    }

    function addTask() {
      const text = input.value.trim();

      if (!text) return;

      tasks.push({
        text: text,
        done: false
      });

      saveTasks();

      input.value = "";

      renderTasks();
      input.focus();
    }

    addButton.addEventListener("click", addTask);

    input.addEventListener("keydown", event => {
      if (event.key === "Enter") {
        addTask();
      }
    });

    renderTasks();
  </script>

</body>
</html>

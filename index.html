<!DOCTYPE html>
<html lang="nl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <title>Mijn taken</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: #f5f5f7;
      color: #1d1d1f;
    }

    .app {
      max-width: 600px;
      margin: 0 auto;
      min-height: 100vh;
      padding: 60px 20px 40px;
    }

    h1 {
      font-size: 34px;
      margin: 0 0 30px;
    }

    .add-task {
      display: flex;
      gap: 10px;
      margin-bottom: 30px;
    }

    input {
      flex: 1;
      font-size: 17px;
      padding: 15px;
      border: 1px solid #d2d2d7;
      border-radius: 12px;
      background: white;
      outline: none;
    }

    button {
      border: 0;
      border-radius: 12px;
      font-size: 24px;
      padding: 0 18px;
      background: #1d1d1f;
      color: white;
    }

    #taskList {
      list-style: none;
      padding: 0;
      margin: 0;
    }

    .task {
      display: flex;
      align-items: center;
      gap: 14px;
      background: white;
      padding: 16px;
      margin-bottom: 10px;
      border-radius: 14px;
      font-size: 18px;
    }

    .task-text {
      flex: 1;
    }

    .task.done .task-text {
      text-decoration: line-through;
      opacity: 0.4;
    }

    .check {
      width: 26px;
      height: 26px;
      border: 2px solid #999;
      border-radius: 50%;
      flex-shrink: 0;
    }

    .task.done .check {
      background: #1d1d1f;
      border-color: #1d1d1f;
    }

    .delete {
      background: none;
      color: #999;
      padding: 5px;
      font-size: 20px;
    }

    .empty {
      color: #888;
      text-align: center;
      margin-top: 60px;
    }
  </style>
</head>

<body>

  <main class="app">
    <h1>Mijn taken</h1>

    <div class="add-task">
      <input
        id="taskInput"
        type="text"
        placeholder="Nieuwe taak…"
        autocomplete="off"
      >
      <button id="addButton">+</button>
    </div>

    <ul id="taskList"></ul>
  </main>

  <script>
    const input = document.getElementById("taskInput");
    const addButton = document.getElementById("addButton");
    const list = document.getElementById("taskList");

    let tasks = JSON.parse(localStorage.getItem("mijnTaken")) || [];

    function saveTasks() {
      localStorage.setItem("mijnTaken", JSON.stringify(tasks));
    }

    function renderTasks() {
      list.innerHTML = "";

      if (tasks.length === 0) {
        list.innerHTML = '<div class="empty">Geen taken 🎉</div>';
        return;
      }

      tasks.forEach((task, index) => {
        const item = document.createElement("li");
        item.className = "task" + (task.done ? " done" : "");

        const check = document.createElement("div");
        check.className = "check";
        check.onclick = () => {
          tasks[index].done = !tasks[index].done;
          saveTasks();
          renderTasks();
        };

        const text = document.createElement("span");
        text.className = "task-text";
        text.textContent = task.text;

        const remove = document.createElement("button");
        remove.className = "delete";
        remove.textContent = "×";
        remove.onclick = () => {
          tasks.splice(index, 1);
          saveTasks();
          renderTasks();
        };

        item.append(check, text, remove);
        list.appendChild(item);
      });
    }

    function addTask() {
      const text = input.value.trim();

      if (!text) return;

      tasks.push({
        text: text,
        done: false
      });

      input.value = "";
      saveTasks();
      renderTasks();
      input.focus();
    }

    addButton.onclick = addTask;

    input.addEventListener("keydown", event => {
      if (event.key === "Enter") {
        addTask();
      }
    });

    renderTasks();
  </script>

</body>
</html>

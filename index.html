<!DOCTYPE html>
<html lang="nl">
<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0, viewport-fit=cover"
  >

  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="LumiVault">
  <meta name="theme-color" content="#f5f5f7">

  <title>LumiVault</title>

  <link rel="apple-touch-icon" href="icon.png?v=2">
  <link rel="stylesheet" href="style.css?v=6">
</head>

<body>

<main class="app">

  <!-- =========================
       HOME
  ========================== -->

  <section id="homeScreen" class="screen active">

    <header class="home-header">
      <div>
        <p id="greeting" class="eyebrow"></p>
        <h1>LumiVault</h1>
      </div>

      <button
        id="openVaultButton"
        class="round-icon-button"
        type="button"
        aria-label="Open mijn Vault"
      >
        ✨
      </button>
    </header>

    <section class="hero-card">
      <p class="hero-kicker">Vandaag</p>

      <h2 id="todayTitle">
        Wat verdient vandaag je aandacht?
      </h2>

      <p class="hero-text">
        Je hoeft niet alles tegelijk vast te houden.
      </p>
    </section>

    <section class="today-section">

      <div class="section-heading">
        <div>
          <p class="eyebrow">Open taken</p>
          <h2>Vandaag</h2>
        </div>

        <span id="todayCount" class="count-badge">0</span>
      </div>

      <ul id="todayList"></ul>

      <div id="todayEmpty" class="soft-empty hidden">
        Geen open taken. Lekker dan. ✨
      </div>

    </section>

    <button id="openCaptureButton" class="capture-fab" type="button">
      <span class="capture-fab-plus">+</span>
      <span>Bewaar iets</span>
    </button>

  </section>


  <!-- =========================
       BEWAAR IETS
  ========================== -->

  <section id="captureScreen" class="screen">

    <header class="screen-header">

      <button
        id="captureBackButton"
        class="back-button"
        type="button"
      >
        ←
      </button>

      <div>
        <p class="eyebrow">Nieuwe Lumi</p>
        <h1>Bewaar iets</h1>
      </div>

    </header>


    <!-- STAP 1 -->

    <div id="captureStepText" class="capture-step active">

      <label class="field-label" for="itemInput">
        Wat wil je bewaren?
      </label>

      <textarea
        id="itemInput"
        class="main-textarea"
        placeholder="Schrijf het uit je hoofd..."
        rows="4"
      ></textarea>

      <button
        id="continueToTypeButton"
        class="primary-button big-button"
        type="button"
      >
        Verder
      </button>

    </div>


    <!-- STAP 2 -->

    <div id="captureStepType" class="capture-step">

      <p class="field-label">
        Wat is dit?
      </p>

      <div class="type-grid">

        <button class="type-choice" data-type="taak" type="button">
          <span class="type-choice-icon">✓</span>
          <span class="type-choice-title">Taak</span>
          <span class="type-choice-text">Iets wat je wilt doen</span>
        </button>

        <button class="type-choice" data-type="gedachte" type="button">
          <span class="type-choice-icon">💭</span>
          <span class="type-choice-title">Gedachte</span>
          <span class="type-choice-text">Iets wat in je hoofd zit</span>
        </button>

        <button class="type-choice" data-type="idee" type="button">
          <span class="type-choice-icon">💡</span>
          <span class="type-choice-title">Idee</span>
          <span class="type-choice-text">Iets om later te onderzoeken</span>
        </button>

        <button class="type-choice" data-type="doel" type="button">
          <span class="type-choice-icon">⭐</span>
          <span class="type-choice-title">Doel</span>
          <span class="type-choice-text">Iets waar je naartoe wilt</span>
        </button>

      </div>

    </div>


    <!-- STAP 3: ALLEEN TAAK -->

    <div id="captureStepPriority" class="capture-step">

      <p class="field-label">
        Hoe urgent is deze taak?
      </p>

      <div class="priority-list">

        <button class="priority-choice" data-priority="1" type="button">
          <strong>1</strong>
          <span>
            <b>Nu</b>
            <small>Dit verdient als eerste aandacht</small>
          </span>
        </button>

        <button class="priority-choice" data-priority="2" type="button">
          <strong>2</strong>
          <span>
            <b>Belangrijk</b>
            <small>Liever snel oppakken</small>
          </span>
        </button>

        <button class="priority-choice selected" data-priority="3" type="button">
          <strong>3</strong>
          <span>
            <b>Normaal</b>
            <small>Geen brand, wel doen</small>
          </span>
        </button>

        <button class="priority-choice" data-priority="4" type="button">
          <strong>4</strong>
          <span>
            <b>Kan wachten</b>
            <small>Niet voor vandaag nodig</small>
          </span>
        </button>

        <button class="priority-choice" data-priority="5" type="button">
          <strong>5</strong>
          <span>
            <b>Geen haast</b>
            <small>Bewaren voor later</small>
          </span>
        </button>

      </div>

      <button
        id="saveTaskButton"
        class="primary-button big-button"
        type="button"
      >
        Bewaar in mijn Vault
      </button>

    </div>

  </section>


  <!-- =========================
       VAULT
  ========================== -->

  <section id="vaultScreen" class="screen">

    <header class="screen-header">

      <button
        id="vaultBackButton"
        class="back-button"
        type="button"
      >
        ←
      </button>

      <div>
        <p class="eyebrow">Alles wat je bewaart</p>
        <h1>Mijn Vault</h1>
      </div>

    </header>


    <div class="filters">

      <button class="filter active" data-filter="alles">
        Alles
      </button>

      <button class="filter" data-filter="taak">
        Taken
      </button>

      <button class="filter" data-filter="gedachte">
        Gedachten
      </button>

      <button class="filter" data-filter="idee">
        Ideeën
      </button>

      <button class="filter" data-filter="doel">
        Doelen
      </button>

    </div>


    <div class="list-options">
      <label>
        <input id="hideCompleted" type="checkbox">
        Verberg afgeronde taken
      </label>
    </div>


    <ul id="vaultList"></ul>

  </section>

</main>


<!-- =========================
     BEWERKEN
========================== -->

<div id="editOverlay" class="overlay hidden">

  <div class="edit-card">

    <h2>Bewerken</h2>

    <textarea
      id="editText"
      class="edit-textarea"
      rows="3"
    ></textarea>

    <label class="small-label">
      Type
    </label>

    <select id="editType">
      <option value="taak">Taak</option>
      <option value="gedachte">Gedachte</option>
      <option value="idee">Idee</option>
      <option value="doel">Doel</option>
    </select>

    <div id="editPriorityWrapper">

      <label class="small-label">
        Urgentie
      </label>

      <select id="editPriority">
        <option value="1">1 · Nu</option>
        <option value="2">2 · Belangrijk</option>
        <option value="3">3 · Normaal</option>
        <option value="4">4 · Kan wachten</option>
        <option value="5">5 · Geen haast</option>
      </select>

    </div>

    <div class="edit-actions">

      <button
        id="cancelEdit"
        class="secondary-button"
        type="button"
      >
        Annuleren
      </button>

      <button
        id="saveEdit"
        class="primary-button"
        type="button"
      >
        Opslaan
      </button>

    </div>

  </div>

</div>


<script>

const STORAGE_KEY = "mijnTaken";

let items = loadItems();

let currentFilter = "alles";
let editingId = null;

let captureText = "";
let captureType = null;
let capturePriority = 3;


/* =========================
   ELEMENTEN
========================= */

const screens = document.querySelectorAll(".screen");

const homeScreen = document.getElementById("homeScreen");
const captureScreen = document.getElementById("captureScreen");
const vaultScreen = document.getElementById("vaultScreen");

const greeting = document.getElementById("greeting");

const todayList = document.getElementById("todayList");
const todayEmpty = document.getElementById("todayEmpty");
const todayCount = document.getElementById("todayCount");

const openCaptureButton =
  document.getElementById("openCaptureButton");

const openVaultButton =
  document.getElementById("openVaultButton");

const captureBackButton =
  document.getElementById("captureBackButton");

const vaultBackButton =
  document.getElementById("vaultBackButton");

const itemInput =
  document.getElementById("itemInput");

const continueToTypeButton =
  document.getElementById("continueToTypeButton");

const captureStepText =
  document.getElementById("captureStepText");

const captureStepType =
  document.getElementById("captureStepType");

const captureStepPriority =
  document.getElementById("captureStepPriority");

const typeChoices =
  document.querySelectorAll(".type-choice");

const priorityChoices =
  document.querySelectorAll(".priority-choice");

const saveTaskButton =
  document.getElementById("saveTaskButton");

const filterButtons =
  document.querySelectorAll(".filter");

const hideCompleted =
  document.getElementById("hideCompleted");

const vaultList =
  document.getElementById("vaultList");

const editOverlay =
  document.getElementById("editOverlay");

const editText =
  document.getElementById("editText");

const editType =
  document.getElementById("editType");

const editPriority =
  document.getElementById("editPriority");

const editPriorityWrapper =
  document.getElementById("editPriorityWrapper");

const cancelEdit =
  document.getElementById("cancelEdit");

const saveEdit =
  document.getElementById("saveEdit");


/* =========================
   OPSLAG
========================= */

function loadItems() {

  try {

    const stored =
      JSON.parse(
        localStorage.getItem(STORAGE_KEY)
      ) || [];

    return stored.map((item, index) => ({

      id:
        item.id ||
        Date.now().toString() +
        "-" +
        index +
        "-" +
        Math.random().toString(16).slice(2),

      text:
        item.text || "",

      type:
        item.type || "taak",

      priority:
        Number(item.priority) || 3,

      done:
        Boolean(item.done),

      createdAt:
        item.createdAt ||
        Date.now() + index

    }));

  } catch {

    return [];

  }

}


function saveItems() {

  localStorage.setItem(
    STORAGE_KEY,
    JSON.stringify(items)
  );

}


/* =========================
   NAVIGATIE
========================= */

function showScreen(name) {

  screens.forEach(
    screen =>
      screen.classList.remove("active")
  );

  if (name === "home") {

    homeScreen.classList.add("active");
    renderHome();

  }

  if (name === "capture") {

    captureScreen.classList.add("active");
    resetCapture();

    setTimeout(
      () => itemInput.focus(),
      150
    );

  }

  if (name === "vault") {

    vaultScreen.classList.add("active");
    renderVault();

  }

  window.scrollTo(0, 0);

}


openCaptureButton.addEventListener(
  "click",
  () => showScreen("capture")
);


openVaultButton.addEventListener(
  "click",
  () => showScreen("vault")
);


captureBackButton.addEventListener(
  "click",
  () => showScreen("home")
);


vaultBackButton.addEventListener(
  "click",
  () => showScreen("home")
);


/* =========================
   GROET
========================= */

function setGreeting() {

  const hour =
    new Date().getHours();

  let text = "Hallo";

  if (hour < 12) {
    text = "Goedemorgen";
  }

  else if (hour < 18) {
    text = "Goedemiddag";
  }

  else {
    text = "Goedenavond";
  }

  greeting.textContent =
    text + " ✨";

}


/* =========================
   HOME
========================= */

function getOpenTasks() {

  return items
    .filter(
      item =>
        item.type === "taak" &&
        !item.done
    )
    .sort(
      (a, b) =>
        a.priority - b.priority
    );

}


function renderHome() {

  setGreeting();

  todayList.innerHTML = "";

  const tasks =
    getOpenTasks();

  todayCount.textContent =
    tasks.length;

  if (tasks.length === 0) {

    todayEmpty.classList.remove("hidden");

    return;

  }

  todayEmpty.classList.add("hidden");


  /*
    Voor nu tonen we maximaal vijf taken.
    Later kan "Vandaag" slimmer worden.
  */

  tasks
    .slice(0, 5)
    .forEach(item => {

      todayList.appendChild(
        createItemCard(
          item,
          true
        )
      );

    });

}


/* =========================
   CAPTURE
========================= */

function showCaptureStep(step) {

  [
    captureStepText,
    captureStepType,
    captureStepPriority
  ].forEach(
    element =>
      element.classList.remove("active")
  );


  if (step === "text") {
    captureStepText.classList.add("active");
  }

  if (step === "type") {
    captureStepType.classList.add("active");
  }

  if (step === "priority") {
    captureStepPriority.classList.add("active");
  }

}


function resetCapture() {

  captureText = "";
  captureType = null;
  capturePriority = 3;

  itemInput.value = "";

  typeChoices.forEach(
    button =>
      button.classList.remove("selected")
  );

  priorityChoices.forEach(
    button => {

      button.classList.toggle(
        "selected",
        Number(button.dataset.priority) === 3
      );

    }
  );

  showCaptureStep("text");

}


continueToTypeButton.addEventListener(
  "click",
  () => {

    captureText =
      itemInput.value.trim();

    if (!captureText) {

      itemInput.focus();

      return;

    }

    showCaptureStep("type");

  }
);


typeChoices.forEach(button => {

  button.addEventListener(
    "click",
    () => {

      captureType =
        button.dataset.type;

      typeChoices.forEach(
        choice =>
          choice.classList.remove("selected")
      );

      button.classList.add("selected");


      /*
        Alleen taken krijgen urgentie.
      */

      if (captureType === "taak") {

        showCaptureStep("priority");

      }

      else {

        saveCapturedItem();

      }

    }
  );

});


priorityChoices.forEach(button => {

  button.addEventListener(
    "click",
    () => {

      capturePriority =
        Number(
          button.dataset.priority
        );

      priorityChoices.forEach(
        choice =>
          choice.classList.remove("selected")
      );

      button.classList.add("selected");

    }
  );

});


saveTaskButton.addEventListener(
  "click",
  saveCapturedItem
);


function saveCapturedItem() {

  if (
    !captureText ||
    !captureType
  ) {
    return;
  }

  items.push({

    id:
      Date.now().toString() +
      "-" +
      Math.random().toString(16).slice(2),

    text:
      captureText,

    type:
      captureType,

    priority:
      captureType === "taak"
        ? capturePriority
        : 3,

    done:
      false,

    createdAt:
      Date.now()

  });

  saveItems();

  showScreen("home");

}


/* =========================
   FILTERS
========================= */

filterButtons.forEach(button => {

  button.addEventListener(
    "click",
    () => {

      currentFilter =
        button.dataset.filter;

      filterButtons.forEach(
        other =>
          other.classList.remove("active")
      );

      button.classList.add("active");

      renderVault();

    }
  );

});


hideCompleted.addEventListener(
  "change",
  renderVault
);


/* =========================
   VAULT
========================= */

function getVaultItems() {

  let result =
    [...items];


  if (currentFilter !== "alles") {

    result =
      result.filter(
        item =>
          item.type === currentFilter
      );

  }


  if (hideCompleted.checked) {

    result =
      result.filter(
        item =>
          !(
            item.type === "taak" &&
            item.done
          )
      );

  }


  result.sort((a, b) => {

    if (
      a.type === "taak" &&
      b.type === "taak"
    ) {

      if (a.done !== b.done) {

        return a.done
          ? 1
          : -1;

      }

      if (!a.done && !b.done) {

        return (
          a.priority -
          b.priority
        );

      }

    }

    return (
      b.createdAt -
      a.createdAt
    );

  });


  return result;

}


function renderVault() {

  vaultList.innerHTML = "";

  const visibleItems =
    getVaultItems();


  if (
    visibleItems.length === 0
  ) {

    const empty =
      document.createElement("div");

    empty.className = "empty";

    empty.textContent =
      currentFilter === "alles"
        ? "Je Vault is leeg ✨"
        : "Hier staat nog niets ✨";

    vaultList.appendChild(empty);

    return;

  }


  visibleItems.forEach(item => {

    vaultList.appendChild(
      createItemCard(
        item,
        false
      )
    );

  });

}


/* =========================
   KAARTEN
========================= */

function createItemCard(
  item,
  compact
) {

  const li =
    document.createElement("li");

  li.className =
    "task" +
    (item.done
      ? " completed"
      : "") +
    (compact
      ? " compact"
      : "");


  const check =
    document.createElement("button");

  check.className = "check";
  check.type = "button";


  if (item.type !== "taak") {

    check.classList.add("not-task");
    check.disabled = true;

  }


  check.addEventListener(
    "click",
    event => {

      event.stopPropagation();

      item.done = !item.done;

      saveItems();
      renderHome();
      renderVault();

    }
  );


  const content =
    document.createElement("div");

  content.className =
    "task-content";


  const meta =
    document.createElement("div");

  meta.className =
    "item-meta";


  const typeBadge =
    document.createElement("span");

  typeBadge.className =
    "type-badge " +
    item.type;

  typeBadge.textContent =
    typeLabel(
      item.type
    );

  meta.appendChild(
    typeBadge
  );


  if (item.type === "taak") {

    const priorityBadge =
      document.createElement("span");

    priorityBadge.className =
      "priority-badge priority-" +
      item.priority;

    priorityBadge.textContent =
      priorityLabel(
        item.priority
      );

    meta.appendChild(
      priorityBadge
    );

  }


  const text =
    document.createElement("div");

  text.className =
    "task-text";

  text.textContent =
    item.text;


  content.append(
    meta,
    text
  );


  li.append(
    check,
    content
  );


  /*
    Op Home houden we kaarten rustig.
    Bewerken/verwijderen gebeurt in de Vault.
  */

  if (!compact) {

    const edit =
      document.createElement("button");

    edit.className =
      "icon-button";

    edit.type =
      "button";

    edit.textContent =
      "✎";

    edit.addEventListener(
      "click",
      () =>
        openEdit(
          item.id
        )
    );


    const remove =
      document.createElement("button");

    remove.className =
      "icon-button delete";

    remove.type =
      "button";

    remove.textContent =
      "×";

    remove.addEventListener(
      "click",
      () => {

        items =
          items.filter(
            stored =>
              stored.id !==
              item.id
          );

        saveItems();
        renderVault();
        renderHome();

      }
    );


    li.append(
      edit,
      remove
    );

  }


  return li;

}


/* =========================
   LABELS
========================= */

function typeLabel(type) {

  const labels = {

    taak: "Taak",
    gedachte: "Gedachte",
    idee: "Idee",
    doel: "Doel"

  };

  return (
    labels[type] ||
    "Taak"
  );

}


function priorityLabel(priority) {

  const labels = {

    1: "1 · Nu",
    2: "2 · Belangrijk",
    3: "3 · Normaal",
    4: "4 · Kan wachten",
    5: "5 · Geen haast"

  };

  return (
    labels[priority] ||
    "3 · Normaal"
  );

}


/* =========================
   BEWERKEN
========================= */

function openEdit(id) {

  const item =
    items.find(
      stored =>
        stored.id === id
    );

  if (!item) return;

  editingId = id;

  editText.value =
    item.text;

  editType.value =
    item.type;

  editPriority.value =
    String(
      item.priority || 3
    );

  updateEditPriorityVisibility();

  editOverlay.classList.remove(
    "hidden"
  );

}


function closeEdit() {

  editingId = null;

  editOverlay.classList.add(
    "hidden"
  );

}


function updateEditPriorityVisibility() {

  editPriorityWrapper.style.display =
    editType.value === "taak"
      ? "block"
      : "none";

}


editType.addEventListener(
  "change",
  updateEditPriorityVisibility
);


cancelEdit.addEventListener(
  "click",
  closeEdit
);


saveEdit.addEventListener(
  "click",
  () => {

    const item =
      items.find(
        stored =>
          stored.id ===
          editingId
      );

    if (!item) return;

    const text =
      editText.value.trim();

    if (!text) return;


    item.text =
      text;

    item.type =
      editType.value;


    if (
      item.type === "taak"
    ) {

      item.priority =
        Number(
          editPriority.value
        );

    }

    else {

      item.priority = 3;
      item.done = false;

    }


    saveItems();

    closeEdit();

    renderVault();
    renderHome();

  }
);


editOverlay.addEventListener(
  "click",
  event => {

    if (
      event.target ===
      editOverlay
    ) {

      closeEdit();

    }

  }
);


/* =========================
   START
========================= */

renderHome();

</script>

</body>
</html>
